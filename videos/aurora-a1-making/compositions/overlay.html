<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #ov-hud {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 84px;
        }
        #ov-hud-inner {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 72px;
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.08em;
        }
        #ov-brand {
          color: #edeaf6;
          font-weight: 700;
        }
        #ov-brand span {
          color: #a49ebe;
          font-weight: 400;
        }
        #ov-step {
          color: #a77bff;
          font-weight: 700;
          min-width: 520px;
          text-align: right;
          white-space: nowrap;
        }
        #ov-rule {
          position: absolute;
          left: 72px;
          right: 72px;
          bottom: 0;
          height: 2px;
          background: #2e2945;
          transform-origin: 0 50%;
        }
        #ov-progress {
          position: absolute;
          left: 72px;
          right: 72px;
          bottom: 36px;
          height: 6px;
          display: flex;
          gap: 10px;
        }
        .ov-seg {
          position: relative;
          flex: 1;
          height: 6px;
          background: #2e2945;
          overflow: hidden;
        }
        .ov-fill {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #a77bff;
          transform-origin: 0 50%;
        }
        #ov-wipe {
          position: absolute;
          top: 0;
          left: 0;
          width: 6px;
          height: 1080px;
          background: #a77bff;
          box-shadow: 0 0 40px 12px rgba(167, 123, 255, 0.55);
        }
      </style>

      <div data-hf-id="hf-kukl" id="root" data-composition-id="overlay" data-width="1920" data-height="1080">
        <div data-hf-id="hf-izki" id="ov-hud">
          <div data-hf-id="hf-r3wx" id="ov-hud-inner">
            <div data-hf-id="hf-n2pg" id="ov-brand">AURORA A1 <span data-hf-id="hf-b8c1">— MAKING OF</span></div>
            <div data-hf-id="hf-lxmi" id="ov-step">STEP 01 / 08 · 接続確認</div>
          </div>
          <div data-hf-id="hf-gbld" id="ov-rule"></div>
        </div>
        <div data-hf-id="hf-m8f6" id="ov-progress">
          <div data-hf-id="hf-1uzz" class="ov-seg"><div data-hf-id="hf-hshj" class="ov-fill"></div></div>
          <div data-hf-id="hf-p5cf" class="ov-seg"><div data-hf-id="hf-at13" class="ov-fill"></div></div>
          <div data-hf-id="hf-or1e" class="ov-seg"><div data-hf-id="hf-aeq2" class="ov-fill"></div></div>
          <div data-hf-id="hf-ocqd" class="ov-seg"><div data-hf-id="hf-a0f1" class="ov-fill"></div></div>
          <div data-hf-id="hf-r4vk" class="ov-seg"><div data-hf-id="hf-csk8" class="ov-fill"></div></div>
          <div data-hf-id="hf-qqkj" class="ov-seg"><div data-hf-id="hf-ce97" class="ov-fill"></div></div>
          <div data-hf-id="hf-qc9i" class="ov-seg"><div data-hf-id="hf-bzy6" class="ov-fill"></div></div>
          <div data-hf-id="hf-pxyh" class="ov-seg"><div data-hf-id="hf-bln5" class="ov-fill"></div></div>
        </div>
        <div data-hf-id="hf-qye2" id="ov-wipe"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const DUR = 106;
          const STEPS = [
            { a: 8, b: 16, label: "STEP 01 / 08 · 接続確認" },
            { a: 16, b: 26, label: "STEP 02 / 08 · インプット" },
            { a: 26, b: 36, label: "STEP 03 / 08 · 寸法抽出" },
            { a: 36, b: 48, label: "STEP 04 / 08 · スクリプト" },
            { a: 48, b: 62, label: "STEP 05 / 08 · ビルド" },
            { a: 62, b: 80, label: "STEP 06 / 08 · 検証ループ" },
            { a: 80, b: 90, label: "STEP 07 / 08 · 分解図" },
            { a: 90, b: 96, label: "STEP 08 / 08 · 出力" },
          ];

          // HUD + progress exist only between the intro and the outro
          tl.fromTo(["#ov-hud", "#ov-progress"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          tl.fromTo("#ov-hud-inner", { y: -16 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 8);
          tl.to(["#ov-hud", "#ov-progress"], { opacity: 1, duration: 0.3, ease: "power1.out" }, 8);
          tl.fromTo("#ov-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 8.1);
          tl.to(["#ov-hud", "#ov-progress"], { opacity: 0, duration: 0.4, ease: "power1.in" }, 95.6);

          // step label: discrete swap at each step boundary
          const stepEl = document.getElementById("ov-step");
          const drv = { t: 0 };
          let last = "";
          tl.to(
            drv,
            {
              t: DUR,
              duration: DUR,
              ease: "none",
              onUpdate: () => {
                let label = STEPS[0].label;
                for (let i = STEPS.length - 1; i >= 0; i--) {
                  if (drv.t >= STEPS[i].a) {
                    label = STEPS[i].label;
                    break;
                  }
                }
                if (label !== last) {
                  stepEl.textContent = label;
                  last = label;
                }
              },
            },
            0,
          );

          // progress segments fill across their step window
          document.querySelectorAll(".ov-fill").forEach((el, i) => {
            const s = STEPS[i];
            tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: s.b - s.a, ease: "none" }, s.a);
          });

          // scan-line wipe on every scene cut
          const CUTS = [8, 16, 26, 36, 48, 62, 80, 90, 96];
          tl.fromTo("#ov-wipe", { x: -40, opacity: 0 }, { x: -40, opacity: 0, duration: 0.01 }, 0);
          CUTS.forEach((c) => {
            tl.set("#ov-wipe", { opacity: 1 }, c - 0.18);
            tl.fromTo("#ov-wipe", { x: -40 }, { x: 1960, duration: 0.36, ease: "power2.inOut", immediateRender: false }, c - 0.18);
            tl.set("#ov-wipe", { opacity: 0 }, c + 0.18);
          });

          window.__timelines["overlay"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
