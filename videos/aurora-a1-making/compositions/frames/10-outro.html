      <div data-hf-id="hf-c8nv" id="root" data-composition-id="s10-outro" data-width="1920" data-height="1080">

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const F = 1 / 60;

          // open from black on the impact, close to black at the end
          tl.fromTo("#s10-black", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
          tl.to("#s10-black", { opacity: 1, duration: 0.9, ease: "power1.in" }, 9.1);

          // waterfall-entry: the whole journey in one line, then the name
          let t = 1.2;
          [["#s10-w1", 60, 0.18], ["#s10-a1", 36, 0.12], ["#s10-w2", 50, 0.16], ["#s10-a2", 36, 0.12], ["#s10-w3", 60, 0.18]].forEach(([sel, y, d]) => {
            tl.set(sel, { opacity: 1, y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
            t += d - F;
          });
          tl.fromTo("#s10-name", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.22, ease: "expo.out", immediateRender: true }, 3.0);
          tl.fromTo("#s10-by", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.16, ease: "power4.out", immediateRender: true }, 3.25);
          tl.fromTo("#s10-scrim", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 0.8);

          window.__timelines["s10-outro"] = tl;
        })();
