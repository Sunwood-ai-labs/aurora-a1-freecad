<!DOCTYPE html>

  <body>
    <template>
      <style>

        .s08-h1 {

        }
        #s08-cam {

        }
        #s08-glow {
          position: absolute;
          left: 170px;
          top: 100px;
          width: 1000px;
          height: 560px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(167, 123, 255, 0.3), rgba(167, 123, 255, 0));
        }
        .s08-img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          transform-origin: 50% 50%;
        }
        #s08-code {
          position: absolute;
          left: 110px;
          top: 430px;
          font-family: "JetBrains Mono", monospace;
          font-size: 30px;
          font-weight: 700;
          color: #edeaf6;
          border: 2px solid #a77bff;
          background: #16131f;
          padding: 14px 22px;
          transform-origin: 0% 50%;
          z-index: 2;
        }
        #s08-code span {
          color: #a77bff;
        }
        #s08-list {
          position: absolute;
          left: 110px;
          top: 540px;
          width: 470px;
          z-index: 2;
        }
        .s08-row {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          padding: 11px 0;
          border-bottom: 2px solid #2e2945;
          transform-origin: 0% 50%;
        }
        .s08-row .n {
          font-size: 28px;
          font-weight: 700;
        }
        .s08-row .o {
          font-family: "JetBrains Mono", monospace;
          font-size: 24px;
          color: #a77bff;
        }
        #s08-note {
          margin-top: 18px;
          font-size: 26px;
          color: #a49ebe;
        }
      </style>

      <div data-hf-id="hf-ywrc" id="root" data-composition-id="s08-explode" data-width="1920" data-height="1080">
        <div data-hf-id="hf-w0ha" id="s08-cam">
          <div data-hf-id="hf-uqiq" id="s08-glow"></div>
          <img data-hf-id="hf-lp2z" class="s08-img" id="s08-asm" src="assets/renders/hero_front34.png" alt="">
          <img data-hf-id="hf-q4nq" class="s08-img" id="s08-exp" src="assets/renders/exploded_front34.png" alt="">
        </div>

        <div data-hf-id="hf-kpwa" class="s08-head">
          <span data-hf-id="hf-oxfu" class="s08-tag" id="s08-tag">STEP 07</span>
          <span data-hf-id="hf-198p" class="s08-h1" id="s08-h1">分解図</span>
          <span data-hf-id="hf-lhxz" class="s08-sub" id="s08-sub">サブアセンブリごとにオフセットして展開</span>
        </div>

        <div data-hf-id="hf-r6h7" id="s08-code">A.<span data-hf-id="hf-8dle">explode</span>(doc, 1.0)</div>
        <div data-hf-id="hf-thb5" id="s08-list">
          <div data-hf-id="hf-arbc" class="s08-row"><span data-hf-id="hf-13vt" class="n">フロントウイング</span><span data-hf-id="hf-bwz9" class="o">X −650</span></div>
          <div data-hf-id="hf-yhj4" class="s08-row"><span data-hf-id="hf-cw42" class="n">エンジンカバー</span><span data-hf-id="hf-dise" class="o">Z +900</span></div>
          <div data-hf-id="hf-xam1" class="s08-row"><span data-hf-id="hf-6owe" class="n">サイドポッド</span><span data-hf-id="hf-e8y8" class="o">Y ±750</span></div>
          <div data-hf-id="hf-xox2" class="s08-row"><span data-hf-id="hf-2ydq" class="n">ホイール ×4</span><span data-hf-id="hf-6yfc" class="o">Y ±800</span></div>
          <div data-hf-id="hf-whzz" class="s08-row"><span data-hf-id="hf-5fjf" class="n">フロア</span><span data-hf-id="hf-g24p" class="o">Z −450</span></div>
          <div data-hf-id="hf-wwb0" class="s08-row"><span data-hf-id="hf-p6cg" class="n">リアウイング</span><span data-hf-id="hf-dpzh" class="o">X +750 Z +450</span></div>
          <div data-hf-id="hf-sbdh" id="s08-note">k = 0 で組立状態に戻る</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const DUR = 10;
          const F = 1 / 60;

          tl.fromTo("#s08-tag", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.13, ease: "power4.out", immediateRender: true }, 0.15);
          tl.fromTo("#s08-h1", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.2, ease: "power4.out", immediateRender: true }, 0.27 - F);
          tl.fromTo("#s08-sub", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.15, ease: "power4.out", immediateRender: true }, 0.48);
          tl.fromTo("#s08-glow", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 0.2);

          // assembled car first; the call lands, then the parts fly apart
          tl.fromTo("#s08-asm", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.3);
          tl.fromTo("#s08-code", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.4);
          const EXPLODE_AT = 2.6;
          tl.fromTo("#s08-exp", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, EXPLODE_AT);
          tl.to("#s08-asm", { opacity: 0, scale: 1.16, duration: 0.6, ease: "power2.in" }, EXPLODE_AT);

          // offsets list as one beat after the burst
          gsap.utils.toArray(".s08-row").forEach((el, i) => {
            tl.fromTo(el, { scale: 0.7, opacity: 0, y: 14 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.4 + i * 0.07);
          });
          tl.fromTo("#s08-note", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 4.4);

          // multi-phase-camera: hold, recoil at the burst, slow push while exploded
          const cam = document.getElementById("s08-cam");
          const phase = { scale: 1.0 };
          tl.to(phase, { scale: 0.97, duration: 0.5, ease: "power2.out" }, EXPLODE_AT);
          tl.to(phase, { scale: 1.06, duration: 5.5, ease: "power2.inOut" }, EXPLODE_AT + 0.8);
          const drift = { p: 0 };
          tl.to(
            drift,
            {
              p: Math.PI * 2 * 1.2,
              duration: DUR,
              ease: "none",
              onUpdate: () => {
                const dx = Math.sin(drift.p) * 6;
                const dy = Math.sin(drift.p * 1.3) * 3;
                cam.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
              },
            },
            0,
          );

          window.__timelines["s08-explode"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
