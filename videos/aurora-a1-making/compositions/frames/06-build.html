      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const DUR = 14;
          const F = 1 / 60;

          tl.fromTo("#s06-tag", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.13, ease: "power4.out", immediateRender: true }, 0.15);
          tl.fromTo("#s06-h1", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.2, ease: "power4.out", immediateRender: true }, 0.27 - F);
          tl.fromTo("#s06-sub", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.15, ease: "power4.out", immediateRender: true }, 0.48);
          tl.fromTo("#s06-list", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.6);
          tl.fromTo("#s06-count-wrap", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.6);
          tl.fromTo("#s06-glow", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, 0.6);

          // stage stack: each sub-assembly group lands on its own beat (1 bar = 2 s)
          const CUM = [11, 27, 35, 59, 78, 84];
          const STAGE_AT = [1.0, 2.5, 4.0, 5.5, 7.0, 8.5];
          const stages = gsap.utils.toArray(".s06-stage");
          stages.forEach((el, i) => {
            tl.fromTo(el, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
            tl.to(el, { opacity: 1, duration: 0.35, ease: "power1.out" }, STAGE_AT[i]);
            if (i > 0) tl.to(stages[i - 1], { opacity: 0, duration: 0.35, ease: "power1.in" }, STAGE_AT[i] + 0.05);
          });

          // checklist: box fills and label brightens on its stage
          gsap.utils.toArray(".s06-item").forEach((el, i) => {
            tl.fromTo(el.querySelector(".s06-box i"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "power3.out" }, STAGE_AT[i]);
            tl.fromTo(el, { color: "#a49ebe" }, { color: "#edeaf6", duration: 0.25, ease: "power1.out" }, STAGE_AT[i]);
          });

          // counting-dynamic-scale: 0 -> 84, stepping to each cumulative total
          const counter = document.getElementById("s06-count");
          const state = { v: 0 };
          const START_SCALE = 0.6;
          tl.fromTo(counter, { scale: START_SCALE }, { scale: 1, duration: STAGE_AT[5] + 1.0 - STAGE_AT[0], ease: "power2.out" }, STAGE_AT[0]);
          CUM.forEach((c, i) => {
            tl.to(
              state,
              {
                v: c,
                duration: 1.0,
                ease: "power3.out",
                onUpdate: () => {
                  counter.textContent = Math.round(state.v);
                },
              },
              STAGE_AT[i],
            );
          });

          // measured facts arrive after the last group lands
          gsap.utils.toArray(".s06-fact").forEach((el, i) => {
            tl.fromTo(el, { scale: 0, opacity: 0, y: 16 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.0 + i * 0.08);
          });

          // multi-phase-camera: the model grows toward the viewer as it completes
          const cam = document.getElementById("s06-cam");
          const phase = { scale: 0.92 };
          tl.to(phase, { scale: 1.0, duration: 8.0, ease: "power1.inOut" }, 1.0);
          tl.to(phase, { scale: 1.05, duration: 4.0, ease: "power2.inOut" }, 9.6);
          const drift = { p: 0 };
          tl.to(
            drift,
            {
              p: Math.PI * 2 * 1.5,
              duration: DUR,
              ease: "none",
              onUpdate: () => {
                const dx = Math.sin(drift.p) * 6;
                const dy = Math.sin(drift.p * 1.3) * 3;
                cam.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
              },
            },
            0,
          );

          window.__timelines["s06-build"] = tl;
        })();
      </script>
