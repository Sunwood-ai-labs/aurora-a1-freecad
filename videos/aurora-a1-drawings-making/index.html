    <script>
      const tl = gsap.timeline({ paused: true });
      // After-Effects style cuts: both scenes are live for 0.5 s around each cut (slots overlap).
      const CUTS = [
        { t: 8, o: "#s01-intro", n: "#s02-ask", k: "zoom" },
        { t: 16, o: "#s02-ask", n: "#s03-plan", k: "zoom" },
        { t: 26, o: "#s03-plan", n: "#s04-probe", k: "zoom" },
        { t: 36, o: "#s04-probe", n: "#s05-bspline", k: "zoom" },
        { t: 48, o: "#s05-bspline", n: "#s06-automate", k: "glitch" },
        { t: 62, o: "#s06-automate", n: "#s07-sections", k: "leak" },
        { t: 80, o: "#s07-sections", n: "#s08-bom", k: "zoom" },
        { t: 90, o: "#s08-bom", n: "#s09-export", k: "zoom" },
        { t: 96, o: "#s09-export", n: "#s10-outro", k: "dissolve" },
      ];
      const rest = { scale: 1, scaleX: 1, x: 0, opacity: 1, filter: "blur(0px) brightness(1)" };
      CUTS.forEach(({ t, o, n, k }) => {
        if (k === "zoom") {
          // cinematic zoom-through: old punches past the lens, new resolves out of soft focus
          tl.fromTo(o, rest, { scale: 1.32, opacity: 0, filter: "blur(16px) brightness(1.25)", duration: 0.45, ease: "power3.in", immediateRender: false }, t - 0.05);
          tl.fromTo(n, { scale: 0.8, opacity: 0, filter: "blur(14px) brightness(1.2)" }, { ...rest, duration: 0.6, ease: "expo.out", immediateRender: false }, t);
        } else if (k === "glitch") {
          tl.set(n, { opacity: 0 }, t);
          // digital break: horizontal stretch + stepped settle (overlay adds RGB bands and flash)
          tl.fromTo(o, rest, { scaleX: 1.45, opacity: 0, filter: "blur(4px) brightness(1.6)", duration: 0.22, ease: "steps(4)", immediateRender: false }, t - 0.05);
          tl.fromTo(n, { scaleX: 1.5, opacity: 0, filter: "blur(6px) brightness(1.8)" }, { ...rest, duration: 0.42, ease: "power4.out", immediateRender: false }, t + 0.08);
        } else if (k === "leak") {
          tl.set(n, { opacity: 0 }, t);
          // overexposure burn: old blows out to light, new develops out of it (overlay adds the leak sweep)
          tl.fromTo(o, rest, { scale: 1.08, opacity: 0, filter: "blur(10px) brightness(2.6)", duration: 0.6, ease: "power2.in", immediateRender: false }, t - 0.2);
          tl.fromTo(n, { scale: 1.06, opacity: 0, filter: "blur(10px) brightness(2.4)" }, { ...rest, duration: 0.9, ease: "power3.out", immediateRender: false }, t + 0.05);
        } else {
          tl.fromTo(o, rest, { opacity: 0, filter: "blur(22px) brightness(1)", duration: 0.5, ease: "sine.inOut", immediateRender: false }, t);
        }
      });
      window.__timelines["main"] = tl;
    </script>
