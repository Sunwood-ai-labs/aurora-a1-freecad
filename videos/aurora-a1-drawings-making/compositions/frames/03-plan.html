            <div data-hf-id="hf-xtou" class="th sec"><img data-hf-id="hf-ga8p" src="assets/sheets/S04_RearWing.png" alt=""><div data-hf-id="hf-2cvb" class="cap"><i data-hf-id="hf-d7g0">04</i>Rウイング</div></div>

      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const DUR = 10;
          const F = 1 / 60;
          tl.fromTo("#d03-tag", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.13, ease: "power4.out", immediateRender: true }, 0.15);
          // tracking-in done with per-glyph x (transform), not letterSpacing (which snaps to pixels)
          (function () {
            const h = document.getElementById("d03-h1");
            const chars = Array.from(h.textContent);
            h.textContent = "";
            chars.forEach((c) => { const g = document.createElement("span"); g.textContent = c; g.style.display = "inline-block"; h.appendChild(g); });
            const gs = Array.from(h.children), mid = (gs.length - 1) / 2;
            gs.forEach((g, i) => tl.fromTo(g, { x: (i - mid) * 30 }, { x: 0, duration: 0.8, ease: "expo.out", immediateRender: true }, 0.18));
          })();
          tl.fromTo("#d03-h1", { opacity: 0, y: 26, filter: "blur(18px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out", immediateRender: true }, 0.18);
          tl.fromTo("#d03-sub", { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", immediateRender: true }, 0.5);
          // spring-pop-entrance: 11 sheets as one beat (stagger capped at ~0.5 s)
          gsap.utils.toArray(".th").forEach((el, i) => {
            tl.fromTo(el, { scale: 0, opacity: 0, filter: "blur(12px)", y: 24 }, { scale: 1, opacity: 1, filter: "blur(0px)", y: 0, duration: 0.55, ease: "power3.out" }, 0.9 + i * 0.045);
          });
          tl.fromTo("#d03-legend", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 2.2);
          const cam = document.getElementById("d03-cam");
          const phase = { scale: 0.97 };
          tl.to(phase, { scale: 1.0, duration: 1.4, ease: "power2.out" }, 0.8);
          tl.to(phase, { scale: 1.04, duration: 5.0, ease: "power2.inOut" }, 4.5);
          const drift = { p: 0 };
          tl.to(drift, {
            p: Math.PI * 2, duration: DUR, ease: "none",
            onUpdate: () => {
              cam.style.transform = `scale(${phase.scale}) translate(${Math.sin(drift.p) * 5}px, ${Math.sin(drift.p * 1.3) * 3}px)`;
            },
          }, 0);
          window.__timelines["s03-plan"] = tl;
        })();
      </script>
