      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const DUR = 8;
          const cam = document.getElementById("d01-cam");
          const phase = { scale: 1.12 };
          tl.to(phase, { scale: 1.0, duration: 1.6, ease: "power2.out" }, 0.1);
          tl.to(phase, { scale: 1.05, duration: 3.2, ease: "power2.inOut" }, 4.2);
          const drift = { p: 0 };
          tl.to(drift, {
            p: Math.PI * 3, duration: DUR, ease: "none",
            onUpdate: () => {
              cam.style.transform = `scale(${phase.scale}) translate(${Math.sin(drift.p) * 6}px, ${Math.sin(drift.p * 1.3) * 3}px)`;
            },
          }, 0);
          tl.fromTo("#d01-glow", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 0);
          tl.fromTo("#d01-sheet", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.1);
          tl.fromTo("#d01-car", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 0.6);

          const F = 1 / 60;
          let t = 1.4;
          tl.set("#d01-kicker", { opacity: 1, y: 40 }, t);
          tl.to("#d01-kicker", { y: 0, duration: 0.13, ease: "power4.out" }, t);
          t += 0.13 - F;
          tl.set("#d01-aurora", { opacity: 1, y: 80 }, t);
          tl.to("#d01-aurora", { y: 0, duration: 0.2, ease: "power4.out" }, t);
          t += 0.2 + 2 * F;
          tl.set("#d01-a1", { opacity: 1, y: 70 }, t);
          tl.to("#d01-a1", { y: 0, duration: 0.16, ease: "expo.out" }, t);
          t += 0.16 - F;
          tl.set("#d01-sub", { opacity: 1, y: 45 }, t);
          tl.to("#d01-sub", { y: 0, duration: 0.15, ease: "power4.out" }, t);
          gsap.utils.toArray(".d01-chip").forEach((el, i) => {
            tl.fromTo(el, { scale: 0, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.4 + i * 0.07);
          });
          // chromatic-glitch: RGB ghosts jitter on quantized time, then clamp to rest
          const glitchHash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          function glitch(sel, at, dur, maxSplit) {
            const copies = gsap.utils.toArray(sel + " .gl-c");
            const amp = { a: 0 };
            tl.set(amp, { a: 1 }, at);
            tl.set(copies, { opacity: 0.85 }, at);
            tl.to(amp, { a: 0, duration: dur, ease: "power3.in", onUpdate: () => {
              const step = Math.floor(tl.time() / (1 / 24));
              copies.forEach((el, l) => gsap.set(el, {
                x: (glitchHash(step * 13 + l * 7) * 2 - 1) * maxSplit * amp.a,
                y: (glitchHash(step * 29 + l * 11) * 2 - 1) * maxSplit * 0.35 * amp.a,
              }));
            } }, at);
            tl.set(copies, { x: 0, y: 0, opacity: 0 }, at + dur);
          }
          glitch("#d01-a1", 1.72, 0.45, 14);
          glitch("#d01-a1", 3.3, 0.16, 9);
          tl.fromTo("#d01-a1", { scaleX: 1.5 }, { scaleX: 1, duration: 0.45, ease: "power4.out", immediateRender: false }, 1.72);
          window.__timelines["s01-intro"] = tl;
        })();
      </script>
