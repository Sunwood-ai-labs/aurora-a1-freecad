        (function () {

          const F = 1 / 60;
          const PX_PER_MM = 3176 / 420;
          // place a sheet crop: centre the page point (mm, TechDraw Y-up) in the box at zoom k
          function crop(img, boxW, boxH, xmm, ymm, k) {
            img.style.width = 3176 * k + "px";
            img.style.height = 2246 * k + "px";
            img.style.left = boxW / 2 - xmm * PX_PER_MM * k + "px";
            img.style.top = boxH / 2 - (297 - ymm) * PX_PER_MM * k + "px";
          }
          crop(document.getElementById("d05-img"), 620, 250, 140, 225, 0.36);

          tl.fromTo("#d05-tag", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.13, ease: "power4.out", immediateRender: true }, 0.15);
          // tracking-in done with per-glyph x (transform), not letterSpacing (which snaps to pixels)
          (function () {
            const h = document.getElementById("d05-h1");
            const chars = Array.from(h.textContent);
            h.textContent = "";
            chars.forEach((c) => { const g = document.createElement("span"); g.textContent = c; g.style.display = "inline-block"; h.appendChild(g); });
            const gs = Array.from(h.children), mid = (gs.length - 1) / 2;
            gs.forEach((g, i) => tl.fromTo(g, { x: (i - mid) * 30 }, { x: 0, duration: 0.8, ease: "expo.out", immediateRender: true }, 0.18));
          })();
          tl.fromTo("#d05-h1", { opacity: 0, y: 26, filter: "blur(18px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out", immediateRender: true }, 0.18);
