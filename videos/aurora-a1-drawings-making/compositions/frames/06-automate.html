      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const F = 1 / 60;
          tl.fromTo("#d06-tag", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.13, ease: "power4.out", immediateRender: true }, 0.15);
          // tracking-in done with per-glyph x (transform), not letterSpacing (which snaps to pixels)
          (function () {
            const h = document.getElementById("d06-h1");
            const chars = Array.from(h.textContent);
            h.textContent = "";
            chars.forEach((c) => { const g = document.createElement("span"); g.textContent = c; g.style.display = "inline-block"; h.appendChild(g); });

            gs.forEach((g, i) => tl.fromTo(g, { x: (i - mid) * 30 }, { x: 0, duration: 0.8, ease: "expo.out", immediateRender: true }, 0.18));
          })();
          tl.fromTo("#d06-h1", { opacity: 0, y: 26, filter: "blur(18px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out", immediateRender: true }, 0.18);

          // one issue per beat (bar = 2 s), issue first then its fix
          gsap.utils.toArray(".row").forEach((el, i) => {
            const at = 1.0 + i * 2.0;
            tl.fromTo(el, { scale: 0.7, opacity: 0, filter: "blur(12px)", y: 16 }, { scale: 1, opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power3.out" }, at);
            tl.fromTo(el.querySelector(".fix"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at + 0.7);
          });
          window.__timelines["s06-automate"] = tl;
