        (function () {

          const DUR = 10;

          tl.fromTo("#d04-tag", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.13, ease: "power4.out", immediateRender: true }, 0.15);
          // tracking-in done with per-glyph x (transform), not letterSpacing (which snaps to pixels)
          (function () {
            const h = document.getElementById("d04-h1");
            const chars = Array.from(h.textContent);
            h.textContent = "";
            chars.forEach((c) => { const g = document.createElement("span"); g.textContent = c; g.style.display = "inline-block"; h.appendChild(g); });
            const gs = Array.from(h.children), mid = (gs.length - 1) / 2;
            gs.forEach((g, i) => tl.fromTo(g, { x: (i - mid) * 30 }, { x: 0, duration: 0.8, ease: "expo.out", immediateRender: true }, 0.18));

          tl.fromTo("#d04-h1", { opacity: 0, y: 26, filter: "blur(18px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out", immediateRender: true }, 0.18);
          tl.fromTo("#d04-sub", { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", immediateRender: true }, 0.5);

          const body = document.getElementById("d04-body");
          const drv = { t: 0 };
          let last = null;
          tl.to(drv, {
            t: DUR, duration: DUR, ease: "none",
            onUpdate: () => {
              let txt = "";
              for (let i = SEQ.length - 1; i >= 0; i--) if (drv.t >= SEQ[i].t) { txt = SEQ[i].text; break; }
              if (txt !== last) { body.textContent = txt; last = txt; }

          [["#d04-c1", 2.9], ["#d04-c2", 4.6], ["#d04-c3", 6.7], ["#d04-c4", 6.9]].forEach(([sel, at]) => {

          });
          // chromatic-glitch: RGB ghosts jitter on quantized time, then clamp to rest
          const glitchHash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          function glitch(sel, at, dur, maxSplit) {
            const copies = gsap.utils.toArray(sel + " .gl-c");
            const amp = { a: 0 };
            tl.set(amp, { a: 1 }, at);
            tl.set(copies, { opacity: 0.85 }, at);
            tl.to(amp, { a: 0, duration: dur, ease: "power3.in", onUpdate: () => {
              const step = Math.floor(tl.time() / (1 / 24));
              copies.forEach((el, l) => gsap.set(el, {
                x: (glitchHash(step * 13 + l * 7) * 2 - 1) * maxSplit * amp.a,
                y: (glitchHash(step * 29 + l * 11) * 2 - 1) * maxSplit * 0.35 * amp.a,
              }));
            } }, at);
            tl.set(copies, { x: 0, y: 0, opacity: 0 }, at + dur);
          }
          glitch("#d04-gl", 4.95, 0.35, 12);
          glitch("#d04-gl", 5.6, 0.16, 8);
          window.__timelines["s04-probe"] = tl;
